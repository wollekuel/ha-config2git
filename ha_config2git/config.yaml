# https://developers.home-assistant.io/docs/apps/configuration#app-configuration
name: ha-config2git
version: "0.1.0"
slug: ha_config2git
description: >-
  Watches the Home Assistant configuration, versions changes with Git and
  pushes them to a GitHub repository over SSH.
url: "https://github.com/wollekuel/ha-config2git"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
map:
  - type: homeassistant_config
    read_only: true
    path: /config
  - type: ssl
    read_only: true
options:
  github_repository: ""
  github_branch: "main"
  git_author_name: "ha-config2git"
  git_author_email: "ha-config2git@home-assistant"
  ssh_private_key_path: "/ssl/id_ed25519"
  commit_debounce_seconds: 30
  push_interval_seconds: 300
  log_level: "info"
  include_patterns:
    - "*.yaml"
    - "*.yml"
    - "*.json"
    - "custom_components/**"
    - "blueprints/**"
    - "esphome/**"
  exclude_patterns:
    - "secrets.yaml"
    - "*.db"
    - "*.db-*"
    - ".storage/**"
schema:
  github_repository: str
  github_branch: str
  git_author_name: str
  git_author_email: str
  ssh_private_key_path: str
  commit_debounce_seconds: int
  push_interval_seconds: int
  log_level: str
  include_patterns:
    - str
  exclude_patterns:
    - str
